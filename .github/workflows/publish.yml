# npm Trusted Publishing: the publish authenticates with the GitHub
# Actions OIDC token — no npm token secret exists to leak or rotate.
# Requires the one-time portal registration (npmjs.com → package →
# Publishing access → Trusted Publisher: this repository, this
# workflow filename). Publishes only on explicit human intent:
# workflow_dispatch (you press the button) or a GitHub release.
name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: smoke the shipped bin (a broken bin never publishes)
        run: |
          out=$(node bin/ommisa.js) ; echo "$out"
          echo "$out" | grep -q "ommisa — the OIML SMART AI"
      - name: publish (OIDC, provenance-attested)
        run: npm publish --access public --provenance
